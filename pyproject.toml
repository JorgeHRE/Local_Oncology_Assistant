[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miproyecto"
version = "0.1.0"
description = "Pipeline RAG biomédico y cohorte OMOP para oncología gástrica"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
