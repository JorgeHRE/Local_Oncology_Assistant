[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oncology-assistant"
version = "0.1.0"
description = "Pipeline RAG biomédico y cohorte OMOP para oncología gástrica"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Access to the local OMOP database (post-ETL steps and their tests).
db = [
    "psycopg[binary]>=3.2,<3.4",
    "python-dotenv>=1.0,<2",
]
# Lint and test tools (used by CI).
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "db: requires the local OMOP Postgres (docker compose up -d db); skipped if unreachable",
]

[tool.ruff]
line-length = 100
