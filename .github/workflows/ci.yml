# Lint and tests on every push and pull request.
# Tests marked `db` need the local OMOP database (Athena vocabulary, not redistributable), so CI
# deselects them explicitly; run them locally with `pytest -m db` (see etl/README.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version (requires-python) and the one used locally.
        python-version: ["3.10", "3.12"]
    steps:
      # Actions pinned to commit SHAs (tag in the comment) so a moved tag cannot change CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[db,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests (without database)
        run: pytest -m "not db"
