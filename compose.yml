# Local OMOP CDM v5.4 environment.
#   docker compose up -d db                  -> start PostgreSQL
#   docker compose --profile etl run --rm etl -> build OMOP from Synthea CSVs (see etl/README.md)
#   docker compose --profile dev run --rm app -> tests / tools in Python (see README.md)
# Everyday commands are wrapped in the Makefile (`make help`).
# Credentials come from .env (copy .env.example; .env is gitignored).

services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Only reachable from this machine.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Settings sized for bulk-loading the vocabulary (~3 GB of CSV) on a 48 GB machine.
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - max_wal_size=8GB
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl:
    build: ./etl
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      SYNTHEA_CSV_DIR: ${SYNTHEA_CSV_DIR:-/data/raw/synthea/output/csv}
      VOCAB_DIR: /data/raw/vocab/extracted
    volumes:
      - ./data/raw:/data/raw:ro
      - ./etl:/etl:ro

  # Python tools and tests. Reaches the database as `db` on the compose network.
  app:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"  # files written to the repo stay yours
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app

  # Synthea v3.3.0 with the gastric cancer module. One thread only: with more, the same seed
  # does not give the same population (ADR-0001). Needs the jar: `make synthea-jar`.
  # -a 36-85, not 30-85: see synthea/README.md.
  synthea:
    image: eclipse-temurin:17-jre
    profiles: ["synthea"]
    working_dir: /work
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/work
    entrypoint: ["java", "-jar", "data/raw/synthea/synthea-with-dependencies-v3.3.0.jar"]
    command:
      - -s
      - "42"
      - -cs
      - "42"
      - -r
      - "20260901"
      - -p
      - "${SYNTHEA_POP:-650}"
      - -a
      - 36-85
      - -d
      - synthea/modules
      - -k
      - synthea/keep/keep_gastric_cancer.json
      - --generate.thread_pool_size=1
      - --exporter.baseDirectory=./data/raw/synthea/output_gastric
      - --exporter.csv.export=true
      - --exporter.fhir.export=false
      - --exporter.years_of_history=0
      - Massachusetts

volumes:
  pgdata:
